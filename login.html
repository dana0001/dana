<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#0d8cff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.login-box{

background:#fff;
width:90%;
max-width:400px;
padding:30px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.3);

}

.logo{

text-align:center;
font-size:30px;
font-weight:bold;
color:#0d8cff;
margin-bottom:25px;

}

input{

width:100%;
padding:15px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;

}

button{

width:100%;
padding:15px;
border:none;
border-radius:50px;
background:#0d8cff;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;

}

button:hover{

background:#006cd8;

}

.register{

text-align:center;
margin-top:20px;

}

.register a{

text-decoration:none;
color:#0d8cff;
font-weight:bold;

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">
LOGIN
</div>

<form action="login.php" method="POST">

<input
type="email"
name="email"
placeholder="Email"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
MASUK
</button>

</form>

<div class="register">

Belum punya akun?

<br><br>

<a href="register.html">
Daftar Sekarang
</a>

</div>

</div>

</body>
</html>
