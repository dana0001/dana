<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Promo Hadiah</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#ffffff;
padding-bottom: 100px;
}

/* Background Atas */
.header-bg{
background:url("top-bg.jpg") center center/cover no-repeat;
padding:20px 0 60px;
}

/* Banner */
.banner{
width:95%;
max-width:700px;
height:250px;
margin:auto;
overflow:hidden;
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

/* Kotak Hadiah */
.box{
width:92%;
max-width:600px;
margin:-40px auto 20px;
background:#fff;
border-radius:28px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.35);
position:relative;
z-index:100;
}

.title{
background:#1f8ee8;
color:#fff;
font-size:22px;
font-weight:bold;
text-align:center;
padding:18px;
}

.nominal{
text-align:center;
font-size:20px;
padding:15px;
}

.btn{
display:block;
width:85%;
margin:18px auto;
padding:18px;
text-align:center;
text-decoration:none;
font-size:24px;
font-weight:bold;
color:#fff;
border-radius:50px;
background:linear-gradient(#2aa8ff,#0c71d3);
box-shadow:0 5px 15px rgba(0,0,0,.35);
transition:.3s;
}

.btn:hover{
transform:scale(1.03);
}

/* Slider Promo */
.slider{
display:flex;
overflow-x:auto;
scroll-behavior:smooth;
scroll-snap-type:x mandatory;
gap:15px;
padding:15px;
}

.slider::-webkit-scrollbar{
display:none;
}

.slide{
flex:0 0 92%;
scroll-snap-align:center;
}

.slide img{
width:100%;
display:block;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.25);
}

/* Navigasi Bawah */
.bottom{
width:100%;
display:block;
margin-top:10px;
position: relative;
}

/* ✅ Posisi Tombol MASUK - Disesuaikan */
.login-area{
    position: absolute;
    top: 42%; /* Dinaikkan sedikit ke atas */
    left: 51%; /* Digeser sedikit ke kanan */
    transform: translate(-50%, -50%);
    width: auto;
    z-index: 999;
}

.login-btn{
    width: 72px;
    height: 72px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    color: #ffffff;
    border-radius: 50%;
    background: #0b8cff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    border: 3px solid #ffffff;
}

@media(max-width:600px){

.banner{
height:190px;
}

.title{
font-size:20px;
}

.nominal{
font-size:18px;
}

.btn{
font-size:20px;
padding:16px;
}

.login-btn{
    width: 68px;
    height: 68px;
    font-size: 15px;
}

.login-area{
    top: 42%;
    left: 51%;
}

}

</style>

</head>

<body>

<!-- Background Atas -->
<div class="header-bg">

<div class="banner">
<img src="banner.jpg" alt="Banner">
</div>

</div>

<!-- Kotak Hadiah -->
<div class="box">

<div class="title">
SILAHKAN PILIH HADIAH ANDA
</div>

<div class="nominal">
Rp. 10.000.000
</div>

<a href="#" class="btn">
Rp. 20.000.000
</a>

<a href="#" class="btn">
Rp. 30.000.000
</a>

</div>

<!-- Slider Promo -->
<div class="slider">

<div class="slide">
<img src="promo1.jpg">
</div>

<div class="slide">
<img src="promo2.jpg">
</div>

<div class="slide">
<img src="promo3.jpg">
</div>

<div class="slide">
<img src="promo4.jpg">
</div>

<div class="slide">
<img src="promo5.jpg">
</div>

<div class="slide">
<img src="promo6.jpg">
</div>

</div>

<!-- Navigasi Bawah -->
<div style="position: relative;">
    <img src="tombolbawah.png" class="bottom" alt="Navigasi Bawah">

    <!-- Tombol MASUK -->
    <div class="login-area">
        <a href="login.html" class="login-btn">
            MASUK
        </a>
    </div>
</div>

<script>

const slider=document.querySelector(".slider");

let posisi=0;

setInterval(()=>{

posisi++;

if(posisi>=6){
posisi=0;
}

slider.scrollTo({
left:posisi*slider.clientWidth,
behavior:"smooth"
});

},3000);

</script>

</body>
</html>
